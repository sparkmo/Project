services:
  web:
    build: .
    ports:
      - "8000:80"
    env_file:
      - .env
    volumes:
      # 업로드 파일을 컨테이너 밖에도 남기고 싶으면 아래 주석 해제
      # - ./uploads:/var/www/html/uploads
      - ./config:/var/www/html/config:ro   # 인트라넷 접속 정보를 껐다 켰다 하기 편하도록
    restart: unless-stopped

  # ⚠️ 이 zip에는 인트라넷 서버(회원/영상 API, 192.168.20.10) 코드가 포함되어 있지
  # 않습니다. 로그인/가입/영상목록 같은 기능까지 실제로 테스트하려면 그 API를
  # 흉내내는 서버가 하나 더 필요합니다. 가지고 계시다면 서비스를 추가하고
  # config/intranet.php의 INTRANET_HOST를 아래 서비스명으로 바꿔주세요.
  #
  # intranet:
  #   build: ../intranet
  #   networks:
  #     default:
  #       aliases:
  #         - intranet-api
