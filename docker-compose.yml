services:
  intranet:
    build: .
    container_name: admin-server
    env_file:
      - .env
    networks:
      docker_bridge:
        ipv4_address: 172.16.0.3 # 인트라넷(Admin) 서버쪽 IP
    ports:
      - "8001:80"        # 192.168.20.10[인트라넷을 돌리는 ip]:8001 -> 172.16.0.3:80
    restart: unless-stopped
 
# docker_bridge 네트워크를 여기서 실제로 생성합니다.
# (DBServer2 쪽 docker-compose.yml은 external: true 로 이 네트워크에 붙기만 합니다.
#  그래서 admin-server를 먼저 켜서 네트워크가 만들어지게 해야 db-server가 정상 연결됩니다.)
networks:
  docker_bridge:
    name: docker_bridge
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.0.0/24
          gateway: 172.16.0.1
 
