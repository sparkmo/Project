services:
  intranet:
    build: .
    ports:
      - "8001:80"
    env_file:
      - .env
    restart: unless-stopped

  # intranet_db / member_db는 OTT 프로젝트와 동일하게 "이미 구성된 별도 DB 서버"에
  # 접속하는 구조라 이 compose 파일에는 DB 컨테이너를 포함하지 않습니다.
  # .env 의 DB_HOST / MEMBER_DB_HOST 가 실제 접근 가능한 주소를 가리키는지 확인하세요.
  #
  # 로컬에서 두 DB까지 통째로 띄워서 테스트하고 싶다면 아래처럼 서비스를 추가하고
  # .env의 DB_HOST=intranet-db, MEMBER_DB_HOST=member-db 로 바꾸면 됩니다.
  #
  # intranet-db:
  #   image: mariadb:11
  #   environment:
  #     MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
  #     MARIADB_DATABASE: intranet_db
  #   volumes:
  #     - ./db.sql:/docker-entrypoint-initdb.d/1-schema.sql
  #     - ./seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
  #
  # member-db:
  #   image: mariadb:11
  #   ports:
  #     - "3308:3306"   # 실제 시나리오의 3308 포트 흉내
  #   environment:
  #     MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
  #     MARIADB_DATABASE: member_db
  #   volumes:
  #     - ./member_db.sql:/docker-entrypoint-initdb.d/1-schema.sql
