services:
  intranet:
    build: .
    ports:
      - "8001:80"
    env_file:
      - .env
    depends_on:
      - intranet-db
      - member-db
    restart: unless-stopped

  # --- 로컬 테스트용 DB 컨테이너 ---
  # 실제 운영에서는 별도 DB 서버를 쓰지만, 아직 그 서버가 없으므로
  # 여기서는 로컬 컨테이너 2개(intranet_db, member_db)로 대체합니다.
  # .env 에서 DB_HOST=intranet-db, MEMBER_DB_HOST=member-db, MEMBER_DB_PORT=3306 로 맞춰야 합니다.
  intranet-db:
    image: docker.io/library/mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: intranet_db
      MARIADB_USER: roror
      MARIADB_PASSWORD: rororpass
    volumes:
      - ./db.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/2-seed.sql

  member-db:
    image: docker.io/library/mariadb:11
    ports:
      - "3308:3306"   # 실제 시나리오의 3308 포트 흉내 (호스트에서 접속할 때만 3308)
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: member_db
      MARIADB_USER: member_admin
      MARIADB_PASSWORD: memberpass
    volumes:
      - ./member_db.sql:/docker-entrypoint-initdb.d/1-schema.sql
